[package]
name = "mdv-tauri"
version = "0.1.0"
description = "A desktop Markdown viewer"
authors = ["Josh V"]
edition = "2021"

[lib]
name = "mdv_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "mdv-tauri"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.8", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.4"
tauri-plugin-opener = "2.5"
thiserror = "1"

[dev-dependencies]
tempfile = "3"
